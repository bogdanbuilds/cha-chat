<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cha Chat login screen</title>
  <desc id="desc">A simple login form with username and password fields and a create account action.</desc>
  <rect width="1200" height="760" fill="#fff"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#171717">
    <text x="92" y="92" font-size="42" font-weight="700">Cha Chat</text>
    <rect x="90" y="160" width="1020" height="230" rx="12" fill="#fff" stroke="#b7b7b7" stroke-width="2"/>
    <text x="124" y="218" font-size="28" font-weight="650">Log in</text>
    <text x="124" y="286" font-size="17">Username</text>
    <rect x="226" y="251" width="260" height="48" rx="4" fill="#fff" stroke="#888"/>
    <text x="244" y="282" font-size="17" fill="#777">your username</text>
    <text x="514" y="286" font-size="17">Password</text>
    <rect x="602" y="251" width="260" height="48" rx="4" fill="#fff" stroke="#888"/>
    <text x="622" y="282" font-size="17" fill="#777">••••••••••</text>
    <rect x="882" y="251" width="106" height="48" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="899" y="282" font-size="17">Log in</text>
    <rect x="124" y="326" width="160" height="42" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="142" y="354" font-size="16">Create account</text>
  </g>
</svg>
