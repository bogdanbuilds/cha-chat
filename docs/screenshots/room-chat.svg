<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cha Chat room conversation</title>
  <desc id="desc">The room view shows a live status, two members exchanging messages, and a message composer.</desc>
  <rect width="1200" height="900" fill="#fff"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#171717">
    <text x="90" y="76" font-size="42" font-weight="700">Cha Chat</text>
    <rect x="90" y="108" width="1020" height="82" rx="10" fill="#fff" stroke="#b7b7b7" stroke-width="2"/>
    <text x="112" y="158" font-size="18">Signed in as <tspan font-weight="700">demo_one (ID 1)</tspan></text>
    <rect x="990" y="128" width="96" height="44" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="1004" y="157" font-size="16">Log out</text>
    <rect x="90" y="208" width="1020" height="190" rx="10" fill="#fff" stroke="#b7b7b7" stroke-width="2"/>
    <text x="112" y="250" font-size="26" font-weight="650">Rooms</text>
    <rect x="112" y="270" width="220" height="44" rx="4" fill="#fff" stroke="#888"/>
    <text x="126" y="299" font-size="16" fill="#777">Room name</text>
    <rect x="345" y="270" width="124" height="44" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="360" y="299" font-size="16">Create room</text>
    <rect x="112" y="326" width="142" height="42" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="127" y="354" font-size="16">Refresh rooms</text>
    <rect x="112" y="372" width="152" height="42" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="128" y="400" font-size="16">Browser check</text>
    <rect x="90" y="424" width="1020" height="400" rx="10" fill="#fff" stroke="#b7b7b7" stroke-width="2"/>
    <text x="112" y="470" font-size="26" font-weight="650">Browser check</text>
    <text x="1036" y="470" font-size="16" fill="#666">Live</text>
    <rect x="112" y="500" width="976" height="232" fill="#fff" stroke="#b7b7b7"/>
    <g font-size="17">
      <text x="128" y="542"><tspan font-weight="700">demo_one</tspan><tspan>: hello from first window</tspan></text>
      <text x="422" y="542" font-size="14" fill="#777">8:48 AM</text>
      <line x1="124" y1="556" x2="1076" y2="556" stroke="#ddd"/>
      <text x="128" y="590"><tspan font-weight="700">demo_two</tspan><tspan>: reply from second window</tspan></text>
      <text x="438" y="590" font-size="14" fill="#777">8:48 AM</text>
      <line x1="124" y1="604" x2="1076" y2="604" stroke="#ddd"/>
      <text x="128" y="638"><tspan font-weight="700">demo_one</tspan><tspan>: final check: first to second</tspan></text>
      <line x1="124" y1="652" x2="1076" y2="652" stroke="#ddd"/>
      <text x="128" y="686"><tspan font-weight="700">demo_two</tspan><tspan>: final check: second to first</tspan></text>
      <line x1="124" y1="700" x2="1076" y2="700" stroke="#ddd"/>
    </g>
    <text x="112" y="780" font-size="17">Message</text>
    <rect x="184" y="750" width="300" height="48" rx="4" fill="#fff" stroke="#888"/>
    <text x="202" y="781" font-size="16" fill="#777">Write a message</text>
    <rect x="500" y="750" width="86" height="48" rx="4" fill="#f5f5f5" stroke="#777"/>
    <text x="519" y="781" font-size="16">Send</text>
  </g>
</svg>
